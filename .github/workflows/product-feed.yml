# Daily Pinterest / Google Merchant Center product feeds (marketing plan v2, item 3).
# Builds feed-google.xml and feed-pinterest.xml from the live product list (commerce-api/scripts/product-feed.mjs)
# and commits them to the site root, so https://ninobattaglia.com/feed-google.xml and /feed-pinterest.xml stay current.
# Pinterest and Merchant Center each fetch their file once a day. Read-only for the shop: the only calls are the
# public product list and one shipping quote per product type (quotes never create orders or payments).
name: Product feeds

on:
  schedule:
    - cron: '35 14 * * *'   # after the 10:00 UTC daily catalog sync has published
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'commerce-api/scripts/product-feed.mjs'
      - 'commerce-api/scripts/feed-designs.json'
      - '.github/workflows/product-feed.yml'

concurrency:
  group: product-feed
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the feeds
        run: node commerce-api/scripts/product-feed.mjs
      - name: Commit when they changed
        id: commit
        run: |
          git add feed-google.xml feed-pinterest.xml
          if git diff --cached --quiet; then echo "Feeds unchanged."; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name github-actions; git config user.email actions@github.com
          git commit -qm "Product feeds: daily refresh"
          git pull -q --rebase origin master
          git push -q origin HEAD:master
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Publish the site
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null && echo "Pages build requested."
