# One-piece sticker artwork (owner, Nov 1, 2026): every design gets a sticker file with one white backing shape, so
# Printful's kiss-cut makes one sticker instead of one per loose part. Builds assets/stickers/<design>.png and
# manifest.json (commerce-api/scripts/make_stickers.py); the shop worker picks them up within the hour
# (src/sticker-art.mjs) and remakes the sticker products.
# Every 6 hours (owner, Nov 3: the free sticker must work for every new design): new designs, from Printful's preview. On demand: "originals" = temporary download links of the full-size
# originals (Nino's T-Shirt Designs folder); each is matched to its design by picture. Links are single-use.
name: Sticker art

on:
  schedule:
    - cron: '50 2,8,14,20 * * *'
  workflow_dispatch:
    inputs:
      originals:
        description: Space-separated temporary download links of original artwork files (optional)
        required: false
      originals_release:
        description: Tag of a draft release holding originals.tar (Nino's T-Shirt Designs folder); deleted after use (optional)
        required: false

concurrency:
  group: sticker-art
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  stickers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pillow numpy scipy
      - name: Download originals
        env:
          ORIGINALS: ${{ inputs.originals }}
        run: |
          mkdir -p /tmp/originals
          i=0
          for u in $ORIGINALS; do
            case "$u" in https://*.dropboxusercontent.com/*|https://*.dropbox.com/*) ;; *) echo "skip a link that isn't Dropbox"; continue;; esac
            i=$((i+1)); curl -sSfL -m 120 -o "/tmp/originals/$(printf '%03d' $i).png" "$u" || echo "link $i failed"
          done
          echo "downloaded $i"
      - name: Download originals from a draft release
        if: inputs.originals_release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.originals_release }}
        run: |
          gh release download "$TAG" -R "${{ github.repository }}" -p originals.tar -D /tmp
          mkdir -p /tmp/orig_x && tar -xf /tmp/originals.tar -C /tmp/orig_x
          find /tmp/orig_x -type f -iname '*.png' -exec cp {} /tmp/originals/ \;
          echo "originals: $(ls /tmp/originals | wc -l)"
      - name: Build sticker artwork
        run: python3 commerce-api/scripts/make_stickers.py . /tmp/originals
      # Mug artwork (owner, Nov 2): each design on the face seen with the handle on the right, on a full-wrap file.
      - name: Build mug artwork
        run: python3 commerce-api/scripts/make_mugs.py .
      - name: Commit when changed
        id: commit
        run: |
          git add -f assets/stickers assets/mugs
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name github-actions; git config user.email actions@github.com
          git commit -qm "Sticker art: one-piece sticker and mug artwork"
          git pull -q --rebase origin master
          git push -q origin HEAD:master
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Delete the originals release
        if: always() && inputs.originals_release != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "${{ inputs.originals_release }}" -R "${{ github.repository }}" --yes --cleanup-tag || true
      - name: Publish the site
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null && echo "Pages build requested."
